# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Validation

env:
  TEST: 'Test ENV'
  NOW: ''
  HEADLESS: true

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - prod
      browser:
        description: 'Browser to run on'
        required: true
        type: choice
        default: 'local'
        options:
          - chrome
          - firefox
          - webkit
          - local
      platform:
        description: 'Platform to run on'
        required: true
        default: 'win11'
        type: choice
        options:
          - win10
          - win11
      testclass:
        description: 'Test Class to run'
        required: false
        default: 'test.mytests.Test1'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean install -DskipTests=true

    - name: Run Test
      run: mvn clean test "-Dtest=${{ inputs.testclass }}" -DbrowserName=${{ inputs.browser }} -Dplatname==${{ inputs.platform }} -DbrowserVersion=latest -Dheadless=${{ env.HEADLESS }}
  
  upload:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Generate Timestamp
      id: timestamp
      run: echo "NOW=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
      
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: reports-${{ env.NOW }}-${{ github.run_number }}      # The custom name of your downloadable zip
        path: target/                        # Directory, file, or wildcard pattern to upload
        retention-days: 7                  # Optional: Auto-delete after X days (default: 90)
    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    # - name: Update dependency graph
    #   uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
